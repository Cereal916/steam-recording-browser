name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test 1.0 baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SteamRecordingBrowser.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build SteamRecordingBrowser.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SteamRecordingBrowser.Tests/SteamRecordingBrowser.Tests.csproj --configuration Release --no-build

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SteamRecordingBrowser.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build SteamRecordingBrowser.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/SteamRecordingBrowser.Tests/SteamRecordingBrowser.Tests.csproj --configuration Release --no-build

      - name: Upload UX images and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-test-results
          path: tests/SteamRecordingBrowser.Tests/bin/Release/net10.0-windows/TestResults/ux/
          if-no-files-found: ignore
          retention-days: 14
